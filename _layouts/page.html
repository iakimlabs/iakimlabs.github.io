---
layout: default
---
<section class="page-hero">
  <div class="container">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1 class="page-title">{{ page.heading | default: page.title }}</h1>
    {% if page.lead %}<p class="lead page-lead">{{ page.lead }}</p>{% endif %}
  </div>
</section>
<section class="section pt-0">
  <div class="container">
    <div class="prose">
      {{ content }}
    </div>
  </div>
</section>

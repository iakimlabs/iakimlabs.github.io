<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#f08a24"/></linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9c2cf"/><stop offset="1" stop-color="#8a95a5"/></linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- crumbs -->
  <g fill="#c9781a">
    <path d="M86 392l26-10 14 22-24 14z"/><path d="M402 116l22 6-4 24-24-6z"/><path d="M412 380l30-4 6 26-30 8z"/><path d="M78 150l20-8 12 18-20 10z"/>
  </g>
  <!-- ears -->
  <circle cx="160" cy="176" r="86" fill="url(#fur)"/><circle cx="352" cy="176" r="86" fill="url(#fur)"/>
  <circle cx="160" cy="176" r="52" fill="#f6a9b8"/><circle cx="352" cy="176" r="52" fill="#f6a9b8"/>
  <!-- head -->
  <ellipse cx="256" cy="300" rx="150" ry="132" fill="url(#fur)"/>
  <!-- eyes -->
  <circle cx="206" cy="282" r="22" fill="#1d2230"/><circle cx="306" cy="282" r="22" fill="#1d2230"/>
  <circle cx="213" cy="274" r="7" fill="#fff"/><circle cx="313" cy="274" r="7" fill="#fff"/>
  <!-- nose & cheeks -->
  <ellipse cx="256" cy="336" rx="20" ry="15" fill="#e2637d"/>
  <circle cx="176" cy="330" r="16" fill="#f6a9b8" opacity=".7"/><circle cx="336" cy="330" r="16" fill="#f6a9b8" opacity=".7"/>
  <!-- whiskers -->
  <g stroke="#5b6574" stroke-width="7" stroke-linecap="round"><path d="M226 348l-70 10M226 360l-62 26M286 348l70 10M286 360l62 26"/></g>
  <!-- crumb held -->
  <path d="M232 384l28-12 26 14-6 30-34 6-20-18z" fill="#e39a3b" stroke="#b56a12" stroke-width="6" stroke-linejoin="round"/>
</svg>

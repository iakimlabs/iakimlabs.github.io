# Studio info used across the site. Edit freely.

founder:
  name: Aleksandr Iakimov
  role: Founder & developer
  github: iakimlabs

about_short: >-
  We are a small independent studio that designs, builds and publishes
  games and apps for Android — from the first prototype to the Google Play listing.

about_long: |
  iakimlabs started as a side project of a web developer who wanted to ship
  things people carry in their pocket. Years of building business web
  applications taught us to care about reliability, clean architecture and
  details nobody notices until they are missing — now we bring that to mobile.

  We keep projects small and focused: casual games you can enjoy in a few
  minutes and practical apps that do one job well. Every release goes through
  real-device testing before it reaches the store.

  Because we went through Google Play's closed-testing requirement ourselves,
  we also help other independent developers get through it — with engaged
  testers and honest feedback.

values:
  - icon: bi-phone
    title: Android first
    text: We design for Android from day one — different screens, devices and Android versions.
  - icon: bi-feather
    title: Small and polished
    text: Fewer features, done properly. Fast to load, easy to understand, pleasant to use.
  - icon: bi-shield-check
    title: Respect for players
    text: Clear privacy policies, no dark patterns, and only the data an app really needs.
  - icon: bi-chat-heart
    title: Listening to feedback
    text: Testers and players shape our updates. Every message gets read.

services:
  - icon: bi-controller
    title: Mobile games
    text: Casual and arcade games for Android — easy to pick up, hard to put down.
  - icon: bi-grid-1x2
    title: Mobile apps
    text: Useful tools and utilities with clean interfaces and careful attention to detail.
  - icon: bi-people
    title: Closed testing
    text: Engaged testers for Google Play's 12-testers / 14-days requirement, with daily usage and feedback.
    url: /testing/
  - icon: bi-rocket-takeoff

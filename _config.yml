# ───────────────────────────────────────────────
#  iakimlabs.com — site settings
# ───────────────────────────────────────────────
title: iakimlabs
tagline: Games & apps for mobile and PC
description: >-
  iakimlabs is an independent studio crafting games and apps for mobile, Windows and Steam —
  starting on Android.
url: "https://iakimlabs.com"
baseurl: ""
lang: en
locale: en_US

email: iakimlabs@gmail.com
github_username: iakimlabs

# Shown in social previews (jekyll-seo-tag)
logo: /assets/img/logo-512.png
image: /assets/img/og.png
social:
  name: iakimlabs
  links:
    - https://github.com/iakimlabs

# Official store badge images (optional). Download them from Google's and Apple's brand
# resources, put them in assets/img/badges/ and set the paths here; until then simple
# text buttons are shown.
badges:
  google_play: ""     # e.g. /assets/img/badges/google-play.svg
  app_store: ""       # e.g. /assets/img/badges/app-store.svg

# Every app is one Markdown file in _apps/
collections:
  apps:
    output: true
    permalink: /apps/:name/

defaults:
  - scope:
      path: ""
      type: apps
    values:
      layout: app

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM

exclude:
  - README.md
  - docs/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - tools/
